name: CI

on:
  push:
  pull_request:

jobs:
  static-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar arquivos Python
        run: python -m compileall -q .
      - name: Verificar manifests e carregamento seguro
        run: python scripts/check_supply_chain.py
